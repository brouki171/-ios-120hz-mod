name: Build iOS 120Hz Mod

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build iOS 120Hz Mod
        uses: geode-sdk/build-geode-mod@main
        id: build
        with:
          target: iOS
          sdk: latest
          cli: latest
          build-config: Release
          configure-args: -DGEODE_DISABLE_PRECOMPILED_HEADERS=ON
          use-lto: false

      - name: Upload .geode
        uses: actions/upload-artifact@v4
        with:
          name: iOS-120Hz-Mod
          path: ${{ steps.build.outputs.build-output }}
          if-no-files-found: error
      - name: Check iOS dylib
        run: |
          find . -name "*.ios.dylib" -exec file {} \;
          find . -name "*.ios.dylib" -exec lipo -info {} \;
